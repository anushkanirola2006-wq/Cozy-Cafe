<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - The Cozy Cafe</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header>
        <h1>☕ The Cozy Cafe</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="menu.html">Menu</a>
            <a href="gallery.html">Gallery</a>
            <a href="contact.html">Contact</a>
            <a href="cart.html">Cart 🛒</a>
        </nav>
    </header>


    <!-- CHECKOUT SECTION -->
    <section class="checkout-section">

        <h2>Complete Your Order 🤎</h2>

        <p>Please enter your details below.</p>

        <form onsubmit="placeOrder(event)">

            <!-- CUSTOMER NAME -->
            <label for="customer-name">Full Name</label>

            <input
                type="text"
                id="customer-name"
                placeholder="Enter your full name"
                required
            >


            <!-- PHONE NUMBER -->
            <label for="customer-phone">Phone Number</label>

            <input
                type="tel"
                id="customer-phone"
                placeholder="Enter your phone number"
                pattern="[0-9]{10}"
                maxlength="10"
                required
            >


            <!-- ADDRESS -->
            <label for="customer-address">Delivery Address</label>

            <textarea
                id="customer-address"
                placeholder="Enter your complete address"
                rows="4"
                required
            ></textarea>


            <!-- PAYMENT METHOD -->
            <label for="payment-method">Payment Method</label>

            <select id="payment-method" required>
                <option value="">Select Payment Method</option>
                <option value="Cash on Delivery">Cash on Delivery</option>
                <option value="Pay at Cafe">Pay at Cafe</option>
            </select>


            <!-- ORDER TOTAL -->
            <div class="checkout-summary">
                <h3>Your Order Total</h3>
                <h2 id="checkout-total">₹0</h2>
            </div>


            <!-- PLACE ORDER -->
            <button type="submit">
                Place Order ☕
            </button>

        </form>

        <p>
            Thank you for choosing The Cozy Cafe! 🤎
        </p>

        <a href="cart.html" class="btn">Back to Cart</a>

    </section>


    <!-- FOOTER -->
    <footer>
        <p>© 2026 The Cozy Cafe. All Rights Reserved.</p>
        <p>Made with 🤎 and coffee.</p>
    </footer>


    <script src="script.js"></script>

</body>
</html>
