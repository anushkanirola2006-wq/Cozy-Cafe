<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Menu | The Cozy Café</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h2>☕ The Cozy Café</h2>
        <nav>
            <a href="index.html">Home</a>
            <a href="index.html#about">About</a>
            <a href="menu.html">Menu</a>
            <a href="gallery.html">Gallery</a>
            <a href="index.html#offers">Offers</a>
            <a href="index.html#reviews">Reviews</a>
            <a href="contact.html">Contact</a>
            <a href="cart.html">Cart 🛒</a>
        </nav>
    </header>

    <section>
        <h1>Our Delicious Menu ☕</h1>
        <p>Find your favourite coffee and treats!</p>

        <!-- SEARCH BAR -->
        <div class="menu-search">
            <input
                type="text"
                id="menu-search"
                placeholder="Search coffee, cake..."
                onkeyup="searchMenu()"
            >
        </div>

        <!-- MENU ITEMS -->
        <div class="review-container" id="menu-list">

            <div class="review-card menu-item">
                <h2>☕ Cappuccino</h2>
                <p>Price: ₹120</p>
                <button onclick="addToCart('Cappuccino', 120)">
                    Add to Cart 🛒
                </button>
            </div>

            <div class="review-card menu-item">
                <h2>🍰 Chocolate Cake</h2>
                <p>Price: ₹150</p>
                <button onclick="addToCart('Chocolate Cake', 150)">
                    Add to Cart 🛒
                </button>
            </div>

            <div class="review-card menu-item">
                <h2>🧋 Iced Coffee</h2>
                <p>Price: ₹130</p>
                <button onclick="addToCart('Iced Coffee', 130)">
                    Add to Cart 🛒
                </button>
            </div>

        </div>

        <p id="no-results" style="display:none;">
            Sorry! No menu item found. 🤎
        </p>

    </section>

    <footer>
        <p>© 2026 The Cozy Café | Made with 🤎 and Coffee</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
