<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Successful | The Cozy Cafe</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .success-section {
            min-height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
            text-align: center;
        }

        .success-card {
            background: #fff4e6;
            color: #654321;
            padding: 45px 30px;
            border-radius: 25px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
        }

        .success-icon {
            font-size: 75px;
            margin-bottom: 15px;
        }

        .success-card h1 {
            margin-bottom: 15px;
        }

        .success-card p {
            line-height: 1.7;
            margin-bottom: 25px;
        }

        .success-card a {
            display: inline-block;
            background: #795548;
            color: white;
            padding: 13px 25px;
            border-radius: 30px;
            text-decoration: none;
        }

        .success-card a:hover {
            background: #a16f50;
        }
    </style>
</head>
<body>

    <header>
        <h1>The Cozy Cafe ☕</h1>
    </header>

    <section class="success-section">
        <div class="success-card">
            <div class="success-icon">🎉☕</div>
            <h1>Order Placed Successfully!</h1>
            <p>
                Thank you for choosing The Cozy Cafe! 🤎
                Your coffee happiness is on its way.
                We hope to see you again soon!
            </p>
            <a href="index.html">Back to Home</a>
        </div>
    </section>

</body>
</html>
